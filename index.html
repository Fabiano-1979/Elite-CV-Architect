    <script>
      (function() {
        try {
          var origDefineProperty = Object.defineProperty;
          var patchFetchDescriptor = function(obj, prop, descriptor) {
            if ((obj === window || (typeof Window !== 'undefined' && obj === Window.prototype)) && prop === 'fetch') {
              if (descriptor && descriptor.get && !descriptor.set) {
                var currentFetch;
                try { currentFetch = descriptor.get(); } catch (_) {}
                descriptor.set = function(newFetch) {
                  currentFetch = newFetch;
                };
                descriptor.configurable = true;
                descriptor.enumerable = true;
                var origGet = descriptor.get;
                descriptor.get = function() {
                  return typeof currentFetch !== 'undefined' ? currentFetch : (origGet ? origGet.call(this) : window.fetch);
                };
              }
            }
          };

          Object.defineProperty = function(obj, prop, descriptor) {
            if (descriptor) {
              patchFetchDescriptor(obj, prop, descriptor);
            }
            return origDefineProperty.apply(this, arguments);
          };

          if (Object.defineProperties) {
            var origDefineProperties = Object.defineProperties;
            Object.defineProperties = function(obj, props) {
              if (props && props.fetch) {
                patchFetchDescriptor(obj, 'fetch', props.fetch);
              }
              return origDefineProperties.apply(this, arguments);
            };
          }
        } catch (e) {
          console.warn('Fetch setter interceptor error:', e);
        }
      })();
    </script>
